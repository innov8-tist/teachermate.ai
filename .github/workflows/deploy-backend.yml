name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: PROD
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST << 'ENDSSH'
            set -e
            
            echo "📦 Pulling latest changes..."
            cd ~/teachermate.ai
            git pull origin main
            
            echo "🔄 Stopping backend container..."
            cd backend
            docker rm -f teachermate-backend 2>/dev/null || true
            docker rm -f teachermate-migrate 2>/dev/null || true
            
            echo "🔨 Building backend image (with cache)..."
            DOCKER_BUILDKIT=1 docker compose build --pull backend
            
            echo "🚀 Starting services..."
            docker compose up -d
            
            echo "⏳ Waiting for migrations to complete..."
            timeout 120 sh -c 'until [ "$(docker inspect -f {{.State.Status}} teachermate-migrate 2>/dev/null)" = "exited" ]; do sleep 2; done' || {
              echo "❌ Migrations timed out"
              docker logs teachermate-migrate --tail 50
              exit 1
            }
            
            echo "⏳ Waiting for backend to be healthy..."
            timeout 120 sh -c 'until docker inspect --format="{{.State.Health.Status}}" teachermate-backend 2>/dev/null | grep -q "healthy"; do sleep 2; done' || {
              echo "❌ Backend failed to become healthy"
              docker logs teachermate-backend --tail 50
              exit 1
            }
            
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo ""
            echo "✅ Deployment successful!"
            echo ""
            docker ps --filter name=teachermate
            echo ""
            echo "📊 Health check:"
            curl -s http://localhost:8082/health | python3 -m json.tool || echo "Health check endpoint not responding"
          ENDSSH

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
