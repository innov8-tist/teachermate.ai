services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-teachermate}-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teachermate}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_BIND_IP:-0.0.0.0}:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-teachermate}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-teachermate}-migrate
    env_file:
      - ./.env
    environment:
      DB_URL_POSTGRES: ${DB_URL_POSTGRES:-postgresql+psycopg2://postgres:postgres@db:5432/teachermate}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-teachermate}
    depends_on:
      db:
        condition: service_healthy
    command: ["/app/scripts/migrate.sh"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-teachermate}-backend
    env_file:
      - ./.env
    environment:
      PORT: 8000
      DB_URL_POSTGRES: ${DB_URL_POSTGRES:-postgresql+psycopg2://postgres:postgres@db:5432/teachermate}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-teachermate}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_BIND_IP:-0.0.0.0}:${BACKEND_PORT:-8082}:8000"
    volumes:
      - backend_public:/app/public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
  backend_public:
