include:
  - postgres/docker-compose.yml

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teachermate-migrate
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -lc "cd /app &&
      uv run python -m alembic -c alembic.ini upgrade head"
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teachermate-backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8082:8000"
    command: >
      sh -lc "cd /app &&
      uv run python -m uvicorn server:app --host 0.0.0.0 --port 8000"
    volumes:
      - backend_public:/app/public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  backend_public:
